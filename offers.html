<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offers for you</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-[#f5efed] text-gray-900">

  
  
  <nav class="bg-white h-16 flex items-center justify-between px-4 sticky top-0 z-20">
    <a href="index.html" class="text-2xl font-bold text-blue-900 px-6">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
  <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
</svg>
    Offer
    </a>

    
  </nav>

  <main class="mx-auto max-w-6xl px-6 pb-32 pt-10">

    <section class="relative overflow-hidden rounded-3xl bg-black">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRM3SD3xX4Sz4W0QFj_wA4y5M-99IpknhjeFCf4yCyQ0Q&s=10" alt="Fresh pepperoni pizza with basil and tomatoes"
           class="h-64 w-full object-cover md:h-80" />
      <div class="absolute inset-0 bg-gradient-to-r from-black/10 via-black/30 to-black/80"></div>
      <div class="absolute inset-y-0 right-0 flex w-full flex-col justify-center p-6 text-white md:w-1/2 md:p-10">
        <span class="w-fit rounded-full bg-red-600 px-3 py-1 text-xs font-bold uppercase tracking-wider">
          Limited-time deals
        </span>
        <h1 class="mt-3 text-4xl font-extrabold md:text-5xl">Offers for you</h1>
        <p class="mt-2 text-lg text-gray-200">Tap Apply and the discount is added to your cart automatically.</p>
      </div>
    </section>

    <div id="offers" class="mt-8 grid gap-5 sm:grid-cols-2 lg:grid-cols-4"></div>

    <p class="mt-8 text-sm text-slate-500">
      Only one offer can be active at a time. Discounts apply to the items you select in your cart.
    </p>
  </main>

  <div id="toast"
       class="pointer-events-none fixed bottom-24 left-1/2 z-50 -translate-x-1/2 translate-y-4 rounded-full bg-gray-900 px-5 py-3 text-sm font-semibold text-white opacity-0 shadow-lg transition-all duration-300">
  </div>

  <div class="fixed bottom-5 left-1/2 flex -translate-x-1/2 items-center gap-8 rounded-full bg-black px-6 py-3 text-white">
    <button>Home</button>
    <button>Menu</button>
    <button class="rounded-full bg-red-600 px-5 py-2">Offers</button>
    <button>Cart</button>
    <button>Profile</button>
  </div>

  <script src="script.js"></script>
  <script>
    const OFFERS = [
      { icon: "🎟️", title: "Get ₹30 OFF",   desc: "On orders of ₹199 or more",                code: "WELCOME30", img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSxXkuS8b7NrJafSUX1pNmWkcJdGBDx4h7eYNy0b8HhqA&s=10", pos: "0% 100%" },
      { icon: "🍕", title: "20% OFF",       desc: "Up to ₹100 off on orders of ₹299 or more", code: "PIZZA20",   img: "images/offer-hero.jpg", pos: "0% 20%" },
      { icon: "🛵", title: "Free delivery", desc: "On orders of ₹399 or more",                code: "FREEDEL",   img: "images/offer-card.jpg", pos: "0% 55%" },
      { icon: "🎉", title: "₹100 OFF",      desc: "On orders of ₹599 or more",                code: "BIG100",    img: "images/offer-hero.jpg", pos: "0% 85%" },
    ];

    const grid = document.getElementById("offers");
    const toastEl = document.getElementById("toast");
    let toastTimer;

    function toast(text) {
      toastEl.textContent = text;
      toastEl.classList.remove("opacity-0", "translate-y-4");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.add("opacity-0", "translate-y-4"), 2200);
    }

    function render() {
      const active = window.Cart ? Cart.coupon() : "";
      grid.innerHTML = OFFERS.map((o) => {
        const on = o.code === active;
        return `
        <article class="group relative flex flex-col overflow-hidden rounded-2xl bg-white shadow-sm ring-1 ring-black/5 transition duration-300 hover:-translate-y-1 hover:shadow-xl">
          <div class="relative h-32 overflow-hidden">
            <img src="${o.img}" alt="" style="object-position:${o.pos}"
                 class="h-full w-full object-cover transition duration-500 group-hover:scale-110" />
            <div class="absolute inset-0 bg-gradient-to-t from-black/50 to-transparent"></div>
            <div class="absolute inset-x-0 top-0 h-1.5 bg-gradient-to-r from-red-600 via-orange-500 to-amber-400"></div>
          </div>
          <div class="flex flex-1 flex-col p-6 pt-0">
            <div class="relative -mt-7 mb-3 grid h-14 w-14 place-items-center rounded-xl bg-white text-3xl shadow-md ring-4 ring-white">${o.icon}</div>
            <h2 class="text-2xl font-extrabold text-red-600">${o.title}</h2>
            <p class="mt-2 min-h-12 text-slate-500">${o.desc}</p>

            <button data-copy="${o.code}" title="Click to copy"
                    class="mt-4 w-fit rounded-lg border-2 border-dashed border-gray-800 px-3 py-1 text-sm font-bold tracking-wide hover:bg-gray-100">
              ${o.code}
            </button>

            <button data-apply="${o.code}"
                    class="mt-4 w-full rounded-full py-3 text-lg font-bold text-white transition active:scale-95 ${on ? "bg-green-600 hover:bg-green-700" : "bg-red-600 hover:bg-red-700"}">
              ${on ? "Applied ✓" : "Apply offer"}
            </button>
          </div>
        </article>`;
      }).join("");
    }

    grid.addEventListener("click", (e) => {
      const apply = e.target.closest("[data-apply]");
      const copy = e.target.closest("[data-copy]");

      if (apply) {
        const code = apply.dataset.apply;
        if (Cart.coupon() === code) {
          Cart.removeCoupon();
          toast(`${code} removed`);
        } else {
          toast(Cart.applyCoupon(code).message);
        }
      }

      if (copy) {
        navigator.clipboard?.writeText(copy.dataset.copy);
        toast(`Code ${copy.dataset.copy} copied`);
      }
    });

    window.addEventListener("cart:change", render); 
    render();
  </script>
</body>
</html>
