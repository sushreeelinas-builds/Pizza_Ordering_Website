<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Domino's Pizza - Menu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { dom: '#e31837', domdark: '#c10f2c' } } }
    };
  </script>
  <style>
    body { font-family: 'Roboto', Arial, sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { scrollbar-width: none; }
    .card-img { background-size: cover; background-position: center; }
  </style>
</head>
<body class="bg-white text-gray-800 pb-24">

  <!-- Header -->
  <header class="sticky top-0 z-30 bg-white">
    <div class="flex items-center justify-between px-3 py-4">
      <div class="flex items-center gap-4">
       <a href="index.html"> <button onclick="history.back()" aria-label="Back" class="text-2xl leading-none">&larr;</button>
        <h1 class="text-xl font-semibold">Domino's Pizza</h1></a>
      </div>
      <div class="flex items-center gap-2">
        <input id="searchInput" type="text" placeholder="Search pizza..."
          class="hidden border rounded-full px-4 py-2 text-sm w-48 sm:w-64 focus:outline-none focus:ring-2 focus:ring-dom" />
        <button id="searchBtn" aria-label="Search" class="w-10 h-10 rounded-full border shadow-sm flex items-center justify-center">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        </button>
      </div>
    </div>

    <!-- Filters -->
    <div class="flex items-center gap-3 px-3 pb-3">
      <button id="vegBtn" class="flex items-center gap-2 border rounded-md px-3 py-2 text-sm shadow-sm">
        <span class="w-5 h-5 border-2 border-green-600 rounded-sm flex items-center justify-center"><span class="w-2.5 h-2.5 rounded-full bg-green-600"></span></span>
        Veg Only
      </button>
      <button id="nonVegBtn" class="flex items-center gap-2 border rounded-md px-3 py-2 text-sm shadow-sm">
        <span class="w-5 h-5 border-2 border-red-800 rounded-sm flex items-center justify-center"><span class="w-0 h-0 border-l-[5px] border-r-[5px] border-b-[8px] border-l-transparent border-r-transparent border-b-red-800"></span></span>
        Non Veg Only
      </button>
      <div class="relative">
        <button id="sortBtn" class="flex items-center gap-2 border rounded-md px-3 py-2 text-sm shadow-sm">Sort by <span>&#8645;</span></button>
        <div id="sortMenu" class="hidden absolute left-0 mt-1 w-48 bg-white border rounded-md shadow-lg z-40 text-sm">
          <button data-sort="default" class="sort-opt block w-full text-left px-4 py-2 hover:bg-gray-100">Relevance</button>
          <button data-sort="low" class="sort-opt block w-full text-left px-4 py-2 hover:bg-gray-100">Price: Low to High</button>
          <button data-sort="high" class="sort-opt block w-full text-left px-4 py-2 hover:bg-gray-100">Price: High to Low</button>
          <button data-sort="save" class="sort-opt block w-full text-left px-4 py-2 hover:bg-gray-100">Biggest Savings</button>
        </div>
      </div>
    </div>

    <!-- Category tabs -->
    <nav id="tabs" class="border-t border-b overflow-x-auto no-scrollbar flex gap-8 px-3 text-sm whitespace-nowrap"></nav>
  </header>

  <!-- Menu -->
  <main class="px-1 pt-2">
    <div class="flex items-center gap-4 my-2">
      <div class="flex-1 border-t"></div>
      <h2 id="sectionTitle" class="text-xl font-semibold text-gray-600">Cheese Lava</h2>
      <div class="flex-1 border-t"></div>
    </div>
    <div id="grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5 p-1"></div>
    <p id="empty" class="hidden text-center text-gray-500 py-16">No items match your filters.</p>
  </main>

  <!-- Cart bar -->
  <a id="cartBar" href="cart.html"
     class="fixed bottom-2 left-1 right-1 z-40 bg-dom text-white rounded-md px-4 py-3 flex items-center justify-between font-medium shadow-lg">
    <span id="cartCount">0 items</span>
    <span class="flex items-center gap-3 font-semibold">
      <span class="relative">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7" viewBox="0 0 24 24" fill="currentColor"><path d="M7 18a2 2 0 100 4 2 2 0 000-4zm10 0a2 2 0 100 4 2 2 0 000-4zM1 2v2h2l3.6 7.6-1.4 2.4A2 2 0 007 17h12v-2H7.4l1.1-2h7.5a2 2 0 001.7-1l3.6-6.5A1 1 0 0020.4 4H5.2l-.9-2H1z"/></svg>
        <span id="cartBadge" class="absolute -top-2 -right-2 bg-black text-white text-[10px] rounded-full w-5 h-5 flex items-center justify-center border border-white">0</span>
      </span>
      View Cart &rsaquo;
    </span>
  </a>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-20 left-1/2 -translate-x-1/2 bg-gray-900 text-white text-sm px-4 py-2 rounded-full opacity-0 pointer-events-none transition-opacity z-50"></div>

  // Desserts
  { id: 18, cat: 'Desserts', name: 'Choco Lava Cake', type: 'veg', price: 109, mrp: 129, size: '1 pc', crust: 'Warm', desc: 'Warm chocolate cake with a gooey molten centre.', img: '' },

  // No Onion No Garlic
  { id: 19, cat: 'No Onion No Garlic', name: 'Jain Cheese Pizza', type: 'veg', price: 289, mrp: 369, size: 'Medium', crust: 'Hand Tossed', desc: 'Made without onion and garlic.', img: '' },

  // Tacos & Parcels
  { id: 20, cat: 'Tacos & Parcels', name: 'Veg Taco Mexicana', type: 'veg', price: 129, mrp: 159, size: '1 pc', crust: 'Baked', desc: 'Crunchy taco loaded with Mexican-style veggies.', img: '' },

  // Slices
  { id: 21, cat: 'Slices', name: 'Cheesy Slice', type: 'veg', price: 79, mrp: 99, size: '1 slice', crust: 'Hand Tossed', desc: 'A single cheesy slice for quick hunger.', img: '' },

  // 2in1
  { id: 22, cat: '2in1 Combos', name: '2in1 Pizza + Garlic Bread', type: 'veg', price: 349, mrp: 459, size: 'Medium', crust: 'Hand Tossed', desc: 'A medium pizza paired with garlic bread.', img: '' },
];

const CATEGORIES = ['Cheese Lava','Big Big Pizza','Veg Pizza','Non-Veg Pizza','Deals','Chicken Feast','Cheese Burst Pizza','Cheese Volcano','Pizza Mania','Garlic Breads & Dips','Beverages','Desserts','No Onion No Garlic','Tacos & Parcels','Slices','2in1 Combos'];

/* ---------- STATE ---------- */
const state = {
  category: 'Cheese Lava',
  veg: false,
  nonVeg: false,
  sort: 'default',
  query: '',
  cart: JSON.parse(localStorage.getItem('cart') || '[]'), // [{id, name, price, mrp, size, crust, type, qty}]
};

const $ = (s) => document.querySelector(s);
const saveCart = () => localStorage.setItem('cart', JSON.stringify(state.cart));

/* ---------- RENDER ---------- */
function renderTabs() {
  $('#tabs').innerHTML = CATEGORIES.map(c => `
    <button data-cat="${c}" class="tab py-3 relative ${c === state.category ? 'font-bold text-black' : 'text-gray-700'}">
      ${c}
      ${c === state.category ? '<span class="absolute left-0 right-0 -bottom-px h-[3px] bg-dom rounded"></span>' : ''}
    </button>`).join('');
}

const vegIcon = `<span class="inline-flex w-5 h-5 bg-white rounded-sm border-2 border-green-600 items-center justify-center shrink-0"><span class="w-2.5 h-2.5 rounded-full bg-green-600"></span></span>`;
const nonVegIcon = `<span class="inline-flex w-5 h-5 bg-white rounded-sm border-2 border-red-800 items-center justify-center shrink-0"><span class="w-0 h-0 border-l-[5px] border-r-[5px] border-b-[8px] border-l-transparent border-r-transparent border-b-red-800"></span></span>`;

function getItems() {
  let items = MENU.filter(i => i.cat === state.category);
  if (state.query) {
    // when searching, look across every category
    const q = state.query.toLowerCase();
    items = MENU.filter(i => i.name.toLowerCase().includes(q));
  }
  if (state.veg) items = items.filter(i => i.type === 'veg');
  if (state.nonVeg) items = items.filter(i => i.type === 'non-veg');
  if (state.sort === 'low') items.sort((a, b) => a.price - b.price);
  if (state.sort === 'high') items.sort((a, b) => b.price - a.price);
  if (state.sort === 'save') items.sort((a, b) => (b.mrp - b.price) - (a.mrp - a.price));
  return items;
}

function cardHTML(i) {
  const inCart = state.cart.find(c => c.id === i.id);
  const save = i.mrp - i.price;
  const bg = i.img
    ? `background-image:url('${i.img}'), linear-gradient(135deg,#7a3a08,#f59e0b)`
    : `background-image:linear-gradient(135deg,#5a2a05,#d97706 60%,#fbbf24)`;
  const action = inCart
    ? `<div class="flex items-center bg-dom text-white rounded-md font-bold text-xl">
         <button data-dec="${i.id}" class="px-4 py-2">&minus;</button>
         <span class="px-2 min-w-[2rem] text-center">${inCart.qty}</span>
         <button data-inc="${i.id}" class="px-4 py-2">+</button>
       </div>`
    : `<button data-add="${i.id}" class="bg-dom hover:bg-domdark text-white font-bold text-lg rounded-md px-10 py-2">Add +</button>`;
  return `
  <article class="rounded-lg overflow-hidden shadow bg-black text-white flex flex-col">
    <div class="card-img relative h-[300px] sm:h-[352px] flex items-end" style="${bg}">
      <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/20 to-transparent"></div>
      ${i.img ? '' : '<span class="absolute inset-0 flex items-center justify-center text-8xl opacity-80">🍕</span>'}
      <div class="relative p-4 w-full">
        <h3 class="flex items-center gap-2 text-xl font-bold">${i.type === 'veg' ? vegIcon : nonVegIcon}<span>${i.name}</span></h3>
        <p class="text-sm mt-1 text-gray-100 line-clamp-2">${i.desc}</p>
      </div>
    </div>
    <div class="bg-[#1c1c1c] px-4 py-3 flex items-center justify-between">
      <div>
        <div class="flex items-center gap-2">
          <span class="text-2xl font-bold">₹${i.price}</span>
          <span class="line-through text-gray-300 font-semibold">₹${i.mrp}</span>
          <span class="bg-green-700 text-white text-xs font-bold px-2 py-0.5 border border-green-400">Save ₹${save}.00</span>
        </div>
        <div class="text-sm font-semibold mt-1">${i.size} &nbsp;|&nbsp; ${i.crust}</div>
      </div>
      ${action}
    </div>
  </article>`;
}

function renderGrid() {
  const items = getItems();
  $('#sectionTitle').textContent = state.query ? `Results for "${state.query}"` : state.category;
  $('#grid').innerHTML = items.map(cardHTML).join('');
  $('#empty').classList.toggle('hidden', items.length > 0);
}

function renderCartBar() {
  const count = state.cart.reduce((s, c) => s + c.qty, 0);
  $('#cartCount').textContent = `${count} item${count === 1 ? '' : 's'}`;
  $('#cartBadge').textContent = count;
  $('#cartBar').classList.toggle('hidden', count === 0);
}

function renderFilters() {
  const on = 'ring-2 ring-dom bg-red-50';
  $('#vegBtn').className = `flex items-center gap-2 border rounded-md px-3 py-2 text-sm shadow-sm ${state.veg ? on : ''}`;
  $('#nonVegBtn').className = `flex items-center gap-2 border rounded-md px-3 py-2 text-sm shadow-sm ${state.nonVeg ? on : ''}`;
}

function renderAll() { renderTabs(); renderGrid(); renderCartBar(); renderFilters(); }

/* ---------- CART ACTIONS ---------- */
function addToCart(id) {
  const item = MENU.find(i => i.id === id);
  const existing = state.cart.find(c => c.id === id);
  if (existing) existing.qty++;
  else state.cart.push({ id: item.id, name: item.name, price: item.price, mrp: item.mrp, size: item.size, crust: item.crust, type: item.type, qty: 1 });
  saveCart(); renderGrid(); renderCartBar();
  toast(`${item.name} added`);
}
function changeQty(id, delta) {
  const c = state.cart.find(c => c.id === id);
  if (!c) return;
  c.qty += delta;
  if (c.qty <= 0) state.cart = state.cart.filter(x => x.id !== id);
  saveCart(); renderGrid(); renderCartBar();
}

let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.remove('opacity-0');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.add('opacity-0'), 1500);
}

/* ---------- EVENTS ---------- */
$('#tabs').addEventListener('click', e => {
  const b = e.target.closest('[data-cat]');
  if (!b) return;
  state.category = b.dataset.cat;
  state.query = ''; $('#searchInput').value = '';
  renderTabs(); renderGrid();
  b.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
});

$('#grid').addEventListener('click', e => {
  const add = e.target.closest('[data-add]');
  const inc = e.target.closest('[data-inc]');
  const dec = e.target.closest('[data-dec]');
  if (add) addToCart(+add.dataset.add);
  if (inc) changeQty(+inc.dataset.inc, 1);
  if (dec) changeQty(+dec.dataset.dec, -1);
});

$('#vegBtn').addEventListener('click', () => { state.veg = !state.veg; if (state.veg) state.nonVeg = false; renderFilters(); renderGrid(); });
$('#nonVegBtn').addEventListener('click', () => { state.nonVeg = !state.nonVeg; if (state.nonVeg) state.veg = false; renderFilters(); renderGrid(); });

$('#sortBtn').addEventListener('click', e => { e.stopPropagation(); $('#sortMenu').classList.toggle('hidden'); });
document.querySelectorAll('.sort-opt').forEach(b => b.addEventListener('click', () => {
  state.sort = b.dataset.sort;
  $('#sortMenu').classList.add('hidden');
  renderGrid();
}));
document.addEventListener('click', () => $('#sortMenu').classList.add('hidden'));

$('#searchBtn').addEventListener('click', () => {
  const inp = $('#searchInput');
  inp.classList.toggle('hidden');
  if (!inp.classList.contains('hidden')) inp.focus();
  else { inp.value = ''; state.query = ''; renderGrid(); }
});
$('#searchInput').addEventListener('input', e => { state.query = e.target.value.trim(); renderGrid(); });

renderAll();
</script>
</body>
</html>
