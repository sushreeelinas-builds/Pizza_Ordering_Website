<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pizza Store Profile</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gray-100 font-sans">

  <!-- Header -->
  <header class="flex h-24 items-center justify-between bg-gray-800 px-6 text-white">

    <button id="headerProfileBtn"
      class="flex h-12 w-12 items-center justify-center overflow-hidden rounded-full bg-gray-500"
      aria-label="Open profile">

      <svg id="headerDefaultIcon" xmlns="http://www.w3.org/2000/svg"
        class="h-8 w-8" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-4.42 0-8 2.24-8 5v2h16v-2c0-2.76-3.58-5-8-5Z"/>
      </svg>

      <img id="headerProfileImage"
        class="hidden h-full w-full object-cover"
        alt="Profile picture">
    </button>

  </header>

  <!-- Overlay -->
  <div id="overlay" class="fixed inset-0 z-40 hidden bg-black/70"></div>

  <!-- Sidebar -->
  <aside id="sidebar"
    class="fixed left-0 top-0 z-50 flex h-screen w-full max-w-[461px] -translate-x-full flex-col overflow-y-auto bg-white transition-transform duration-300">

    <!-- Profile Header -->
    <section class="flex min-h-[140px] items-center gap-3 bg-gray-50 px-4 py-5">

      <button id="sidebarProfileBtn"
        class="flex h-12 w-12 shrink-0 items-center justify-center overflow-hidden rounded-full bg-gray-500 text-white"
        aria-label="Profile picture options">

        <svg id="sidebarDefaultIcon" xmlns="http://www.w3.org/2000/svg"
          class="h-8 w-8" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-4.42 0-8 2.24-8 5v2h16v-2c0-2.76-3.58-5-8-5Z"/>
        </svg>

        <img id="sidebarProfileImage"
          class="hidden h-full w-full object-cover"
          alt="Profile picture">
      </button>

      <div class="min-w-0 flex-1">
        <p id="greeting" class="break-words text-base font-medium text-gray-800">
          Login for Exclusive Offers
        </p>
      </div>

      <button id="sidebarLoginBtn"
        class="shrink-0 rounded-lg bg-rose-600 px-5 py-4 text-lg font-bold text-white hover:bg-rose-700">
        Login
      </button>
    </section>

    <!-- Profile Picture Options -->
    <section id="pictureOptions" class="hidden space-y-3 border-b bg-white p-4">

      <p class="font-semibold text-gray-800">Profile Picture</p>

      <button id="uploadImageBtn"
        class="w-full rounded-lg bg-rose-600 px-4 py-3 text-left font-medium text-white hover:bg-rose-700">
        Upload Profile Picture
      </button>

      <button id="changeImageBtn"
        class="hidden w-full rounded-lg border border-gray-300 px-4 py-3 text-left hover:bg-gray-100">
        Change Profile Picture
      </button>

      <button id="removeImageBtn"
        class="hidden w-full rounded-lg border border-red-200 px-4 py-3 text-left text-red-600 hover:bg-red-50">
        Remove Profile Picture
      </button>

      <input id="imageInput" type="file" accept="image/*" class="hidden">
    </section>

    <!-- Navigation -->
    <nav class="flex-1">
      <a href="#deals" class="block px-4 py-5 text-xl hover:bg-gray-100">Deals &amp; Offers</a>
      <a href="#track" class="block px-4 py-5 text-xl hover:bg-gray-100">Track Current Order</a>
      <a href="#history" class="block px-4 py-5 text-xl hover:bg-gray-100">Order History</a>
      <a href="#terms" class="block px-4 py-5 text-xl hover:bg-gray-100">Terms &amp; Conditions</a>
      <a href="#help" class="block px-4 py-5 text-xl hover:bg-gray-100">Need Help? Chat with Us!</a>
      <a href="#bulk" class="block px-4 py-5 text-xl hover:bg-gray-100">Bulk Order</a>
      <a href="#nutrition" class="block px-4 py-5 text-xl hover:bg-gray-100">Nutritional Information</a>

      <button id="logoutBtn"
        class="mx-4 mb-6 mt-2 hidden w-[calc(100%-2rem)] rounded-lg bg-rose-600 px-4 py-4 text-left text-lg font-semibold text-white hover:bg-rose-700">
        Logout
      </button>
    </nav>
  </aside>

  <!-- Main Content -->
  

  <script>
    const STORAGE_KEY = "pizzaStoreProfile";
    const IMAGE_DB = "pizzaStoreImages";
    const IMAGE_STORE = "profilePictures";
    const $ = id => document.getElementById(id);

    // Open IndexedDB for profile images.
    function openImageDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(IMAGE_DB, 1);

        request.onupgradeneeded = () => {
          const db = request.result;
          if (!db.objectStoreNames.contains(IMAGE_STORE)) {
            db.createObjectStore(IMAGE_STORE);
          }
        };

        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    async function saveImage(blob) {
      const db = await openImageDB();

      return new Promise((resolve, reject) => {
        const tx = db.transaction(IMAGE_STORE, "readwrite");
        tx.objectStore(IMAGE_STORE).put(blob, "currentProfileImage");
        tx.oncomplete = () => {
          db.close();
          resolve();
        };
        tx.onerror = () => {
          db.close();
          reject(tx.error);
        };
        tx.onabort = () => {
          db.close();
          reject(tx.error || new Error("Image save was cancelled."));
        };
      });
    }

    async function loadImage() {
      const db = await openImageDB();

      return new Promise((resolve, reject) => {
        const tx = db.transaction(IMAGE_STORE, "readonly");
        const request = tx.objectStore(IMAGE_STORE).get("currentProfileImage");

        request.onsuccess = () => resolve(request.result || null);
        request.onerror = () => reject(request.error);

        tx.oncomplete = () => db.close();
        tx.onerror = () => db.close();
      });
    }

    async function deleteImage() {
      const db = await openImageDB();

      return new Promise((resolve, reject) => {
        const tx = db.transaction(IMAGE_STORE, "readwrite");
        tx.objectStore(IMAGE_STORE).delete("currentProfileImage");

        tx.oncomplete = () => {
          db.close();
          resolve();
        };

        tx.onerror = () => {
          db.close();
          reject(tx.error);
        };
      });
    }

    function loadProfile() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || null;
      } catch {
        return null;
      }
    }

    let profile = loadProfile();
    let imageURL = null;

    function saveProfile() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(profile));
        return true;
      } catch {
        alert("Unable to save profile information in this browser.");
        return false;
      }
    }

    function openSidebar() {
      $("sidebar").classList.remove("-translate-x-full");
      $("overlay").classList.remove("hidden");
    }

    function closeSidebar() {
      $("sidebar").classList.add("-translate-x-full");
      $("overlay").classList.add("hidden");
      $("loginPanel").classList.add("hidden");
      $("pictureOptions").classList.add("hidden");
    }

    function showLogin() {
      openSidebar();
      $("pictureOptions").classList.add("hidden");
      $("loginPanel").classList.remove("hidden");
      $("nameInput").value = profile?.name || "";
      $("emailInput").value = profile?.email || "";
    }

    function renderProfile() {
      const loggedIn = Boolean(profile?.loggedIn);
      const hasImage = Boolean(imageURL);

      $("headerLoginBtn").classList.toggle("hidden", loggedIn);
      $("sidebarLoginBtn").classList.toggle("hidden", loggedIn);

      // Display the user's name after login, never their email.
      $("greeting").textContent = loggedIn
        ? profile.name
        : "Login for Exclusive Offers";

      $("logoutBtn").classList.toggle("hidden", !loggedIn);

      $("sidebarProfileImage").classList.toggle("hidden", !hasImage);
      $("sidebarDefaultIcon").classList.toggle("hidden", hasImage);
      $("headerProfileImage").classList.toggle("hidden", !hasImage);
      $("headerDefaultIcon").classList.toggle("hidden", hasImage);

      if (hasImage) {
        $("sidebarProfileImage").src = imageURL;
        $("headerProfileImage").src = imageURL;
      } else {
        $("sidebarProfileImage").removeAttribute("src");
        $("headerProfileImage").removeAttribute("src");
      }

      // Upload is shown when no image exists.
      $("uploadImageBtn").classList.toggle("hidden", hasImage);
      $("changeImageBtn").classList.toggle("hidden", !hasImage);
      $("removeImageBtn").classList.toggle("hidden", !hasImage);

      $("loginPanel").classList.add("hidden");
    }

    // Restore the saved image from IndexedDB.
    async function restoreImage() {
      try {
        const blob = await loadImage();

        if (blob) {
          imageURL = URL.createObjectURL(blob);
        } else {
          imageURL = null;
        }

        renderProfile();
      } catch (error) {
        console.error("Could not restore profile image:", error);
      }
    }

    $("headerProfileBtn").addEventListener("click", () => {
      openSidebar();

      if (!profile?.loggedIn) {
        showLogin();
      } else {
        $("loginPanel").classList.add("hidden");
        $("pictureOptions").classList.add("hidden");
      }
    });

    $("sidebarProfileBtn").addEventListener("click", () => {
      if (!profile?.loggedIn) {
        showLogin();
        return;
      }

      $("loginPanel").classList.add("hidden");
      $("pictureOptions").classList.toggle("hidden");
    });

    $("headerLoginBtn").addEventListener("click", showLogin);
    $("sidebarLoginBtn").addEventListener("click", showLogin);

    $("cancelBtn").addEventListener("click", () => {
      $("loginPanel").classList.add("hidden");
    });

    $("overlay").addEventListener("click", closeSidebar);

    $("loginForm").addEventListener("submit", event => {
      event.preventDefault();

      const name = $("nameInput").value.trim();
      const email = $("emailInput").value.trim().toLowerCase();

      if (!name || !email) return;

      const previousProfile = profile;

      profile = {
        name,
        email,
        loggedIn: true
      };

      if (saveProfile()) {
        renderProfile();
        $("pictureOptions").classList.add("hidden");
      } else {
        profile = previousProfile;
      }
    });

    function chooseImage() {
      if (profile?.loggedIn) {
        $("imageInput").click();
      }
    }

    $("uploadImageBtn").addEventListener("click", chooseImage);
    $("changeImageBtn").addEventListener("click", chooseImage);

    // No file-size restriction: store the selected image as a Blob in IndexedDB.
    $("imageInput").addEventListener("change", async event => {
      const file = event.target.files[0];
      if (!file) return;

      if (!file.type.startsWith("image/")) {
        alert("Please select a valid image file.");
        event.target.value = "";
        return;
      }

      try {
        await saveImage(file);

        if (imageURL) URL.revokeObjectURL(imageURL);
        imageURL = URL.createObjectURL(file);

        renderProfile();
        openSidebar();
        $("pictureOptions").classList.remove("hidden");
      } catch (error) {
        console.error("Image save failed:", error);
        alert("The browser could not save this image. It may exceed available storage.");
      }

      event.target.value = "";
    });

    $("removeImageBtn").addEventListener("click", async () => {
      try {
        await deleteImage();

        if (imageURL) URL.revokeObjectURL(imageURL);
        imageURL = null;

        renderProfile();
        $("pictureOptions").classList.remove("hidden");
      } catch (error) {
        console.error("Image removal failed:", error);
        alert("Unable to remove the profile picture.");
      }
    });

    $("logoutBtn").addEventListener("click", () => {
      if (!profile?.loggedIn) return;

      const previousStatus = profile.loggedIn;
      profile.loggedIn = false;

      if (saveProfile()) {
        renderProfile();
        closeSidebar();
      } else {
        profile.loggedIn = previousStatus;
      }
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") closeSidebar();
    });

    renderProfile();
    restoreImage();
  </script>

</body>
</html>
